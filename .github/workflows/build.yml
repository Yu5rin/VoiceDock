# Windows 向け単一 exe のビルド検証・アーティファクト生成、および手動実行によるリリース
#
# Actions の無料枠を無駄に消費しないよう、次の方針にしている:
#   - タグ push では起動しない（手動でタグを作ってリリースする場合に自動実行させないため）
#   - リリースは「Run workflow」からの手動実行のみ
#   - ドキュメントのみの変更ではビルドしない
name: build

on:
  push:
    branches: ["**"]
    paths-ignore:
      - "**.md"
      - "tools/**"
      - ".gitignore"
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: "リリースするバージョンタグ (例: v0.6.0)。Release を作成します"
        required: true
        default: "v0.6.0"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: .NET SDK のセットアップ
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: ビルド
        run: dotnet build src/VoiceDock/VoiceDock.csproj -c Release

      - name: 単一 exe の発行
        run: >
          dotnet publish src/VoiceDock/VoiceDock.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:DebugType=none
          -p:DebugSymbols=false
          -o publish

      - name: アーティファクトのアップロード
        # ストレージ容量超過などのアップロード失敗でビルド結果を失敗扱いにしない
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: VoiceDock-win-x64
          path: publish/VoiceDock.exe
          retention-days: 3

  # 手動実行 (Run workflow) 時のみ、単一 exe をビルドして GitHub Release を作成・添付する
  release:
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: リリースするバージョンタグの決定
        id: ver
        shell: bash
        run: echo "tag=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"

      - name: .NET SDK のセットアップ
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: 単一 exe の発行
        run: >
          dotnet publish src/VoiceDock/VoiceDock.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:DebugType=none
          -p:DebugSymbols=false
          -o publish

      - name: リリース用に exe をバージョン名でリネーム
        shell: pwsh
        run: Copy-Item publish/VoiceDock.exe "publish/VoiceDock-${{ steps.ver.outputs.tag }}-win-x64.exe"

      # 本文は「変更点」と「ダウンロード」だけにし、アプリの説明・導入・更新の方法・動作条件・
      # 注意事項は README に置く（CLAUDE.md「リリース」）。以前はここに導入や動作条件を書いていたが、
      # README と同じ説明が版の数だけ並ぶうえ、アプリの更新画面にもそのまま表示されていたため外した。
      # アプリの自動更新が照合する SHA256 は本文ではなく、GitHub がファイルごとに持つ digest を読んでいる
      # （UpdateService.ParseRelease）。本文の表は人が確かめるためのもの。
      # 本文はアプリの更新画面にそのまま表示される。以前は即時公開だったため、公開してから
      # 「変更点」を書き換えるまでの間に更新を確認した利用者に仮の文言が見えていた。
      # 下書きで作り、変更点を書き入れてから公開する（下書きは releases/latest に出ないので、
      # 公開するまで自動更新の対象にならない）。
      - name: リリース本文の組み立て
        shell: pwsh
        run: |
          $tag = "${{ steps.ver.outputs.tag }}"
          $file = Get-Item "publish/VoiceDock-$tag-win-x64.exe"
          $sha = (Get-FileHash $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          $inv = [System.Globalization.CultureInfo]::InvariantCulture
          $size = if ($file.Length -ge 1MB) { ($file.Length / 1MB).ToString("0.0", $inv) + " MB" } else { ($file.Length / 1KB).ToString("0.0", $inv) + " KB" }
          $lines = @(
            "## 変更点"
            ""
            "（ここに変更点を書く）"
            ""
            "## ダウンロード"
            ""
            "| ファイル | サイズ | SHA256 |"
            "| --- | --- | --- |"
            "| $($file.Name) | $size | ``$sha`` |"
            ""
            "インストールと更新の方法は [README](https://github.com/Yu5rin/VoiceDock#インストールと更新) をご覧ください。"
          )
          $lines -join "`n" | Out-File -FilePath release-notes.md -Encoding utf8

      - name: GitHub Release の作成
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: ${{ steps.ver.outputs.tag }}
          files: publish/VoiceDock-${{ steps.ver.outputs.tag }}-win-x64.exe
          body_path: release-notes.md
          draft: true
