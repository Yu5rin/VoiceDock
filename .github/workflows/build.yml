# Windows 向け単一 exe のビルド検証・アーティファクト生成、および手動実行によるリリース
#
# Actions の無料枠を無駄に消費しないよう、次の方針にしている:
#   - タグ push では起動しない（手動でタグを作ってリリースする場合に自動実行させないため）
#   - リリースは「Run workflow」からの手動実行のみ
#   - ドキュメントのみの変更ではビルドしない
name: build

on:
  push:
    branches: ["**"]
    paths-ignore:
      - "**.md"
      - "tools/**"
      - ".gitignore"
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: "リリースするバージョンタグ (例: v0.6.0)。Release を作成します"
        required: true
        default: "v0.6.0"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: .NET SDK のセットアップ
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: ビルド
        run: dotnet build src/VoiceDock/VoiceDock.csproj -c Release

      - name: 単一 exe の発行
        run: >
          dotnet publish src/VoiceDock/VoiceDock.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:DebugType=none
          -p:DebugSymbols=false
          -o publish

      - name: アーティファクトのアップロード
        # ストレージ容量超過などのアップロード失敗でビルド結果を失敗扱いにしない
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: VoiceDock-win-x64
          path: publish/VoiceDock.exe
          retention-days: 3

  # 手動実行 (Run workflow) 時のみ、単一 exe をビルドして GitHub Release を作成・添付する
  release:
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: リリースするバージョンタグの決定
        id: ver
        shell: bash
        run: echo "tag=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"

      - name: .NET SDK のセットアップ
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: 単一 exe の発行
        run: >
          dotnet publish src/VoiceDock/VoiceDock.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:DebugType=none
          -p:DebugSymbols=false
          -o publish

      - name: リリース用に exe をバージョン名でリネーム
        shell: pwsh
        run: Copy-Item publish/VoiceDock.exe "publish/VoiceDock-${{ steps.ver.outputs.tag }}-win-x64.exe"

      - name: GitHub Release の作成
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: VoiceDock ${{ steps.ver.outputs.tag }}
          generate_release_notes: true
          files: publish/VoiceDock-${{ steps.ver.outputs.tag }}-win-x64.exe
          body: |
            Web Speech API を用いた音声入力ツール VoiceDock の ${{ steps.ver.outputs.tag }} リリースです。
            タスクトレイに常駐し、ホットキー（初期値 `Ctrl+Space`）で任意の Windows アプリの入力欄に音声で直接入力できます。

            ## 導入
            1. `VoiceDock-${{ steps.ver.outputs.tag }}-win-x64.exe` をダウンロードし、任意の場所に置いて実行します（署名なし・インストーラー不要）。
            2. タスクトレイにマイクのアイコンが表示されます。裏で認識用ブラウザが起動します（画面には出ません）。
            3. テキスト入力欄にカーソルを置き、`Ctrl+Space` を押して話すと文字が入力されます。もう一度押すと停止します。

            設定・辞書管理・ログはトレイアイコンの右クリックメニューから開けます。

            ## 動作条件
            - Windows 10 / 11
            - Microsoft Edge または Google Chrome（Windows の既定ブラウザに追従。設定で明示指定も可能）
            - インターネット接続（Web Speech API はクラウド認識のため）

            ## ご注意
            - 音声はブラウザの音声認識サービス（クラウド）に送信されます。機密性の高い内容の取り扱いにはご注意ください。
            - 署名なし exe のため、初回実行時に SmartScreen の警告が出る場合があります。
            - 辞書のエクスポート CSV には社内用語・人名が含まれます。保存先・共有方法にご注意ください。

            詳細は [README](https://github.com/Yu5rin/VoiceDock/blob/main/README.md) を参照してください。
